name: Apply immediate heart like patch

on:
  push:
    paths:
      - .github/workflows/apply-immediate-heart-like.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Patch immediate anonymous heart like events'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch collector and normalizer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Không tìm thấy marker: {label}")
              return text.replace(old, new, 1)

          dom_path = Path("src/collector/dom_collector.mjs")
          dom = dom_path.read_text(encoding="utf-8")

          dom = replace_once(
              dom,
              '''    maxStoredEvents: 2000,\n    commentSelectors: [''',
              '''    maxStoredEvents: 2000,\n    likeElementDedupeMs: 350,\n    likeWarmupMs: 2000,\n    likeMaxDescendants: 100,\n    commentSelectors: [''',
              "collector config",
          )

          dom = replace_once(
              dom,
              '''    commentRowValue: new WeakMap(),\n    events: [],''',
              '''    commentRowValue: new WeakMap(),\n    likeElementLastSeen: new WeakMap(),\n    startedAt: Date.now(),\n    likeCount: 0,\n    events: [],''',
              "collector state",
          )

          dom = replace_once(
              dom,
              '''    const previous = state.recent.get(key) ?? 0;\n    if (now - previous < CONFIG.dedupeMs) return;\n    state.recent.set(key, now);''',
              '''    const bypassRecentDedupe =\n      type === "like" && payload.source === "heart-animation";\n\n    if (!bypassRecentDedupe) {\n      const previous = state.recent.get(key) ?? 0;\n      if (now - previous < CONFIG.dedupeMs) return;\n      state.recent.set(key, now);\n    }''',
              "emit dedupe",
          )

          dom = replace_once(
              dom,
              '''    const type = classifySystemAction(action);\n    if (!type) return;\n\n    const rowValue = `${type}|${owner.uniqueId || owner.sender}|${action}`;''',
              '''    const type = classifySystemAction(action);\n    if (!type) return;\n\n    // LIKE được lấy trực tiếp từ hiệu ứng tim. Bỏ dòng hệ thống để tránh\n    // một lần thích bị phát cả từ tim bay và thông báo văn bản.\n    if (type === "like") return;\n\n    const rowValue = `${type}|${owner.uniqueId || owner.sender}|${action}`;''',
              "ignore system like",
          )

          like_helpers = r'''
  const LIKE_POSITIVE_PATTERN =
    /heart|like|reaction|digg|floating-heart|like-animation|like_animation|tym|thích/i;
  const LIKE_NEGATIVE_PATTERN =
    /gift|share|comment|follow|avatar|captcha|verify|sticker|profile/i;

  function getLikeMeta(element) {
    if (!(element instanceof Element)) return "";

    return clean(
      [
        element.tagName,
        element.id,
        element.getAttribute("class"),
        element.getAttribute("data-e2e"),
        element.getAttribute("data-testid"),
        element.getAttribute("aria-label"),
        element.getAttribute("title"),
        element.getAttribute("role"),
        element.getAttribute("style"),
      ]
        .filter(Boolean)
        .join(" ")
    );
  }

  function isVisibleLikeElement(element) {
    if (!(element instanceof Element)) return false;

    const rect = element.getBoundingClientRect();
    const style = getComputedStyle(element);

    return (
      rect.width > 0 &&
      rect.height > 0 &&
      style.display !== "none" &&
      style.visibility !== "hidden" &&
      Number(style.opacity || 1) > 0
    );
  }

  function isSemanticHeart(element) {
    const meta = getLikeMeta(element);
    if (!meta || LIKE_NEGATIVE_PATTERN.test(meta)) return false;
    return LIKE_POSITIVE_PATTERN.test(meta);
  }

  function isAnimatedHeartGraphic(element) {
    if (!(element instanceof Element) || !isVisibleLikeElement(element)) {
      return false;
    }

    const rect = element.getBoundingClientRect();
    if (
      rect.width < 5 ||
      rect.height < 5 ||
      rect.width > 180 ||
      rect.height > 180
    ) {
      return false;
    }

    const style = getComputedStyle(element);
    const meta = getLikeMeta(element);
    if (LIKE_NEGATIVE_PATTERN.test(meta)) return false;

    const animated =
      style.animationName !== "none" ||
      style.transform !== "none" ||
      style.position === "absolute" ||
      style.position === "fixed";

    const hasGraphic =
      element.matches("svg, img") || Boolean(element.querySelector("svg, img"));

    return animated && hasGraphic;
  }

  function findHeartRoot(element) {
    if (!(element instanceof Element)) return null;

    let current = element;
    for (let depth = 0; current && depth < 6; depth += 1) {
      if (isSemanticHeart(current) || isAnimatedHeartGraphic(current)) {
        return current;
      }
      current = current.parentElement;
    }

    return null;
  }

  function collectLikeElements(node, output) {
    const element = getElement(node);
    if (!element) return;

    const candidates = [element];
    let scanned = 0;

    for (const child of element.querySelectorAll("*")) {
      if (scanned++ >= CONFIG.likeMaxDescendants) break;
      candidates.push(child);
    }

    for (const candidate of candidates) {
      const root = findHeartRoot(candidate);
      if (root) output.add(root);
    }
  }

  function processLikeElement(element) {
    if (!(element instanceof Element)) return;

    const now = Date.now();
    if (now - state.startedAt < CONFIG.likeWarmupMs) return;

    const previous = state.likeElementLastSeen.get(element) || 0;
    if (now - previous < CONFIG.likeElementDedupeMs) return;
    state.likeElementLastSeen.set(element, now);

    state.likeCount += 1;

    // Không gom: mỗi tim DOM bắt được phát ngay một event count=1.
    emit(
      "like",
      {
        sender: null,
        uniqueId: null,
        count: 1,
        action: "heart-animation",
        source: "heart-animation",
        anonymous: true,
        suspected: true,
        raw: null,
      },
      element
    );
  }

'''

          dom = replace_once(
              dom,
              '''  function getCommentRow(item) {''',
              like_helpers + '''  function getCommentRow(item) {''',
              "insert like helpers",
          )

          dom = replace_once(
              dom,
              '''    const commentItems = new Set();\n\n    for (const record of records) {''',
              '''    const commentItems = new Set();\n    const likeElements = new Set();\n\n    for (const record of records) {''',
              "like set",
          )

          dom = replace_once(
              dom,
              '''      collectCommentItems(record.target, commentItems);\n\n      if (record.type === "childList") {''',
              '''      collectCommentItems(record.target, commentItems);\n\n      if (record.type === "attributes") {\n        collectLikeElements(record.target, likeElements);\n      }\n\n      if (record.type === "childList") {''',
              "attribute like collection",
          )

          dom = replace_once(
              dom,
              '''          collectCommentItems(node, commentItems);\n        }\n      }''',
              '''          collectCommentItems(node, commentItems);\n          collectLikeElements(node, likeElements);\n        }\n      }''',
              "added node like collection",
          )

          dom = replace_once(
              dom,
              '''      for (const item of commentItems) processCommentItem(item, true);\n    });''',
              '''      for (const item of commentItems) processCommentItem(item, true);\n      for (const element of likeElements) processLikeElement(element);\n    });''',
              "process like elements",
          )

          dom = replace_once(
              dom,
              '''    characterData: true,\n  });''',
              '''    characterData: true,\n    attributes: true,\n    attributeFilter: ["class", "style", "data-e2e", "aria-label"],\n  });''',
              "observer attributes",
          )

          dom = replace_once(
              dom,
              '''        commentItemCount: commentItems.size,\n      };''',
              '''        commentItemCount: commentItems.size,\n        likeCount: state.likeCount,\n        likeMode: "heart-animation-immediate",\n      };''',
              "state like stats",
          )

          dom = replace_once(
              dom,
              '''    giftMode: "name-and-delta-count",\n    mode: "dom-observer",''',
              '''    giftMode: "name-and-delta-count",\n    likeMode: "heart-animation-immediate",\n    mode: "dom-observer",''',
              "status like mode",
          )

          dom_path.write_text(dom, encoding="utf-8")

          normalizer_path = Path("src/core/event_normalizer.mjs")
          normalizer = normalizer_path.read_text(encoding="utf-8")

          normalizer = replace_once(
              normalizer,
              '''  resolveUser(rawEvent) {\n    const displayName = cleanText(rawEvent?.sender) || "Không rõ";''',
              '''  resolveUser(rawEvent) {\n    const eventType = cleanText(rawEvent?.type).toLowerCase();\n\n    if (eventType === "like" && rawEvent?.anonymous) {\n      return {\n        id: "anonymous:like",\n        uniqueId: null,\n        displayName: "LIKE",\n        identityType: "anonymous",\n      };\n    }\n\n    const displayName = cleanText(rawEvent?.sender) || "Không rõ";''',
              "anonymous like user",
          )

          normalizer = replace_once(
              normalizer,
              '''    if (eventType === "like") {\n      payload.count = Math.max(1, Math.floor(Number(rawEvent.count) || 1));\n      payload.action = cleanText(rawEvent.action) || null;\n      payload.suspected = true;\n    }''',
              '''    if (eventType === "like") {\n      payload.count = Math.max(1, Math.floor(Number(rawEvent.count) || 1));\n      payload.action = cleanText(rawEvent.action) || null;\n      payload.source = cleanText(rawEvent.source) || "unknown";\n      payload.anonymous = Boolean(rawEvent.anonymous);\n      payload.suspected = true;\n    }''',
              "like payload",
          )

          normalizer_path.write_text(normalizer, encoding="utf-8")

          smoke_path = Path("scripts/smoke_test.mjs")
          smoke = smoke_path.read_text(encoding="utf-8")
          marker = '''assert.equal(normalizer.normalize({ type: "leave", sender: "Dương" }), null);'''
          addition = '''assert.equal(normalizer.normalize({ type: "leave", sender: "Dương" }), null);\n\nconst anonymousLike = normalizer.normalize({\n  type: "like",\n  sender: null,\n  uniqueId: null,\n  count: 1,\n  source: "heart-animation",\n  anonymous: true,\n});\nassert.equal(anonymousLike.user.id, "anonymous:like");\nassert.equal(anonymousLike.user.identityType, "anonymous");\nassert.equal(anonymousLike.payload.count, 1);\nassert.equal(anonymousLike.payload.source, "heart-animation");\nassert.equal(anonymousLike.payload.anonymous, true);'''
          smoke = replace_once(smoke, marker, addition, "smoke anonymous like")
          smoke_path.write_text(smoke, encoding="utf-8")

          workflow = Path(".github/workflows/apply-immediate-heart-like.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Check syntax and smoke test
        run: |
          npm install
          npm run check
          npm run test:smoke

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Patch immediate anonymous heart like events"
          git push origin main
